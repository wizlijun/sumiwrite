name: SumiWrite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  # 内嵌输入法 RimeKit:本机 ~/git/rime-kit(路径相对本文件),先在那里跑 scripts/fetch.sh。见 README「一次性准备」。
  RimeKit:
    path: ../../../rime-kit
  # 按住说话 VoiceKit:本机 ~/git/voice-kit(路径相对本文件),从 rapp 移植。见 README「一次性准备」。
  VoiceKit:
    path: ../../../voice-kit
targets:
  SumiWrite:
    type: application
    platform: iOS
    sources:
      - path: SumiWrite
      - path: build/gen
      - path: ../notemd-plugin/resources/sounds
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/SumiCoreFFI.xcframework
        embed: false
      - package: RimeKit
        product: RimeKit
      - package: RimeKit
        product: RimeKitUI
      - package: VoiceKit
        product: VoiceKit
      - package: VoiceKit
        product: VoiceKitUI
    info:
      path: build/Info-app.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - IBMPlexMono-Light.ttf
          - IBMPlexSansSC-Light.otf
          - LXGWWenKaiMonoLite-Regular.ttf
          - ZhaohuaTypeWriter.ttf
        # 按住说话的用途说明(语音输入设计 §6.5)。
        NSMicrophoneUsageDescription: 按住语音按钮说话时录音，转成文字写进纸页
        NSSpeechRecognitionUsageDescription: 把你按住语音按钮时说的话转成文字
        # AI 整理的接入点多半在局域网里(ios.md §3.7「AI 整理」):只放开本地网络的 http,公网照旧要 https。
        NSLocalNetworkUsageDescription: 连接你在设置里填写的 AI 整理接入点
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: "Sumi Write"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SumiWriteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SumiWriteTests
      - path: build/fixtures
        type: folder
    dependencies:
      - target: SumiWrite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SumiWrite.app/SumiWrite
        BUNDLE_LOADER: $(TEST_HOST)
  # 只给 scripts/sim-rime.sh 用:在模拟器上替脚本点按候选行(脚本用 simkey 发键)。不进 Verification。
  SumiWriteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SumiWriteUITests
    dependencies:
      - target: SumiWrite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).uitests
        TEST_TARGET_NAME: SumiWrite
schemes:
  SumiWrite:
    build:
      targets:
        SumiWrite: all
        SumiWriteTests: [test]
    test:
      targets:
        - SumiWriteTests
  SumiWriteUI:
    build:
      targets:
        SumiWrite: all
        SumiWriteUITests: [test]
    test:
      targets:
        - SumiWriteUITests
