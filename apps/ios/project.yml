name: SumiWrite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SumiWrite:
    type: application
    platform: iOS
    sources:
      - path: SumiWrite
      - path: build/gen
    dependencies:
      - framework: build/SumiCoreFFI.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 玄霜写作
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SumiWriteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SumiWriteTests
      - path: build/fixtures
        type: folder
    dependencies:
      - target: SumiWrite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SumiWrite.app/SumiWrite
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SumiWrite:
    build:
      targets:
        SumiWrite: all
        SumiWriteTests: [test]
    test:
      targets:
        - SumiWriteTests
